name: Library checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[tables,dev]'
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - name: Execute teaching notebook
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: |
          python -m ipykernel install --user --name ccrt-ci
          python -c "import nbformat; from nbclient import NotebookClient; NotebookClient(nbformat.read('examples/reconciliation_walkthrough.ipynb', as_version=4), timeout=60, kernel_name='ccrt-ci').execute()"
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: |
          python -m venv /tmp/ccrt-smoke
          /tmp/ccrt-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/ccrt-smoke/bin/python "$GITHUB_WORKSPACE/benchmarks/smoke_install.py"
          ccrt_wheel=$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print -quit)
          /tmp/ccrt-smoke/bin/pip install "${ccrt_wheel}[tables]"
          /tmp/ccrt-smoke/bin/python "$GITHUB_WORKSPACE/benchmarks/smoke_install.py" --tables
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
